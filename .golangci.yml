version: "2"
linters:
  default: standard
  enable:
    - errorlint
    - revive
    - gocritic
    - misspell
    - nilerr
    - bodyclose
    - goconst
  settings:
    errcheck:
      exclude-functions:
        - (*os.File).Close
        - os.Remove
    revive:
      rules:
        - name: exported
  exclusions:
    presets: []
formatters:
  enable:
    - gofmt
